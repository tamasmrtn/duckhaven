# Prose lint for docs/. The DuckHaven style encodes the rules in
# docs/developer/writing-docs.md; the reasons behind each rule are there too.
# Levels start lenient (warnings), and each subject folder is made strict in
# the section at the bottom once its pages have been rewritten.
StylesPath = .vale/styles
Vocab = DuckHaven
MinAlertLevel = suggestion

[docs/**/*.md]
BasedOnStyles = Vale, DuckHaven
# Product, SQL and Python identifiers make spelling checks mostly noise.
Vale.Spelling = NO
# GitHub references such as duckdb/ducklake#1278 are names, not prose.
TokenIgnores = [\w.-]+/[\w.-]+#\d+

# Contributor docs and release notes describe change over time by design.
[docs/{developer,release-notes}/**/*.md]
DuckHaven.Changelog = NO
DuckHaven.FuturePromises = NO

# Generated from the CLI's command tree in duckhaven-clients; edits here are
# overwritten, so it is not linted.
[docs/reference/cli.md]
BasedOnStyles =
