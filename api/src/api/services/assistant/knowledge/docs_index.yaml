# Generated by `make docs-index` from docs/ and mkdocs.yml — do not add pages
# by hand. Summaries ARE hand-editable: regeneration preserves them.
intro: |-
  DuckHaven is a self-hosted data lakehouse. Apache Iceberg brought the table format,
  Apache Polaris the catalog, and DuckDB the engine; DuckHaven is the control plane that
  holds the three together, so a team can run its own lakehouse instead of renting one.
  It gives collaborative browser worksheets, a governed Iceberg catalog, compute that
  scales to zero between runs, scheduled queries, column-level lineage, a semantic layer,
  an advisory maintenance scanner, single sign-on, fine-grained access grants, machine
  identities, and governed AI access — all on your own infrastructure, in one Docker
  Compose deploy. No cloud warehouse lock-in, no Kubernetes, no platform team required.
pages:
- path: getting-started/what-is-duckhaven.md
  title: What is DuckHaven?
  section: Get started
  summary: DuckHaven is a self-hosted data lakehouse.
- path: getting-started/quickstart.md
  title: Quickstart
  section: Get started
  summary: Install DuckHaven with Docker Compose, create the first admin, and query a table you created
    yourself in about fifteen minutes.
- path: getting-started/cli-quickstart.md
  title: Command line (dh)
  section: Get started
  summary: Install dh, DuckHaven's command-line interface, sign in, and run queries and catalog commands
    from a terminal or a script.
- path: getting-started/how-duckhaven-works.md
  title: How DuckHaven works
  section: Get started
  summary: DuckHaven splits into a control plane that decides what may run and agents that run it,
    with your tables on object storage you own.
- path: querying/query-execution.md
  title: Query execution
  section: Querying
  summary: A query is checked by the API, sent to an agent, waits until the agent has memory to start
    it, runs, and is kept as a result file read a page at a time.
- path: querying/run-queries.md
  title: Run queries
  section: Querying
  summary: Write SQL in a worksheet, run it on an agent you choose, read the result, and find earlier
    runs in History.
- path: querying/saved-queries.md
  title: Saved queries
  section: Querying
  summary: Save a worksheet's SQL under a name so everyone in the workspace can open it, run it and
    schedule it.
- path: querying/schedule-queries.md
  title: Schedule queries
  section: Querying
  summary: Run a saved query automatically on a cron schedule, such as every night at 02:00, with
    every run recorded.
- path: querying/query-profiles.md
  title: Read query profiles
  section: Querying
  summary: Open a query's profile to see where its time and memory went, and whether it was slow because
    it waited or because it worked.
- path: querying/result-cache.md
  title: Result cache
  section: Querying
  summary: The result cache answers a repeated query from an earlier run's result when nothing it
    reads has changed, so it does not run again.
- path: querying/sql-sessions.md
  title: SQL sessions
  section: Querying
  summary: A SQL session is a database connection that DuckHaven holds open on one agent, so a tool
    can run many statements that share state.
- path: querying/connect-dbt.md
  title: Connect dbt
  section: Querying
  summary: Run a dbt project on DuckHaven with the dbt-duckhaven adapter, so models build in your
    catalogs on DuckHaven's agents.
- path: querying/load-data-with-dlt.md
  title: Load data with dlt
  section: Querying
  summary: Load data from any dlt source into DuckHaven tables with the dlt-duckhaven destination.
- path: querying/session-audit.md
  title: Read the session audit trail
  section: Querying
  summary: Use the Connections screen to see which SQL sessions are holding agents, what a dbt or
    dlt run did, and why a session ended.
- path: querying/troubleshooting.md
  title: Troubleshoot queries
  section: Querying
  summary: Find the message you see in the results pane, in History, or in a tool's error, then follow
    what to do.
- path: data/catalogs.md
  title: Catalogs
  section: Data & storage
  summary: A catalog is a collection of schemas and tables with its own metadata store and storage,
    which any number of workspaces can attach.
- path: data/manage-catalogs.md
  title: Manage catalogs
  section: Data & storage
  summary: Browse a workspace's catalogs, create, attach, detach and drop catalogs, and create and
    drop their schemas and tables.
- path: data/tables.md
  title: Tables & Iceberg
  section: Data & storage
  summary: A table in an Iceberg catalog is an Apache Iceberg table that Polaris manages, with snapshots,
    schema evolution and time travel.
- path: data/snapshots-time-travel.md
  title: Snapshots & time travel
  section: Data & storage
  summary: Browse a table's snapshot history and query the table as it was at an earlier snapshot
    or time.
- path: data/ducklake.md
  title: DuckLake
  section: Data & storage
  summary: A DuckLake catalog keeps its metadata in PostgreSQL and its data as Parquet in object storage;
    only DuckDB can read it, but DuckHaven can maintain it.
- path: data/create-a-ducklake-catalog.md
  title: Create a DuckLake catalog
  section: Data & storage
  summary: Create a DuckLake catalog, create and query its tables, and drop it when you are done with
    it.
- path: data/storage-backends.md
  title: Storage backends
  section: Data & storage
  summary: A storage backend is an object-storage location, such as a bucket and prefix, where the
    tables of one or more catalogs live.
- path: data/configure-storage.md
  title: Configure storage
  section: Data & storage
  summary: Register an AWS S3 or Azure ADLS Gen2 bucket as a storage backend, test it, and create
    catalogs on it.
- path: data/migrate-catalog-storage.md
  title: Migrate a catalog's storage
  section: Data & storage
  summary: Move a catalog to another storage backend, such as from the bundled object store to an
    S3 bucket, with all its data and snapshot history.
- path: data/maintenance.md
  title: Lakehouse maintenance
  section: Data & storage
  summary: The maintenance advisor scans every table, scores its health, and recommends compaction,
    snapshot expiry and cleanup; for DuckLake tables it can also run them.
- path: metadata/table-metadata.md
  title: Metadata
  section: Metadata & lineage
  summary: What Polaris owns, what Postgres owns, and the table-metadata sidecar.
- path: metadata/lineage.md
  title: Lineage
  section: Metadata & lineage
  summary: Where a table's data came from, and what breaks if you change it.
- path: metadata/import-dbt-lineage.md
  title: Import lineage from dbt
  section: Metadata & lineage
  summary: Publish a dbt project's DAG into DuckHaven's lineage graph.
- path: metadata/semantic-layer.md
  title: Semantic layer
  section: Metadata & lineage
  summary: Recording what a business term means so a metric is computed one agreed way.
- path: metadata/define-metrics.md
  title: Define metrics
  section: Metadata & lineage
  summary: Author a semantic model and publish it so the assistant will use it.
- path: metadata/import-dbt-semantics.md
  title: Import semantics from dbt
  section: Metadata & lineage
  summary: Import metric definitions from dbt's semantic layer.
- path: ai/assistant.md
  title: AI assistant
  section: AI assistant & MCP
  summary: The governed AI data assistant and how it enforces access.
- path: ai/use-the-assistant.md
  title: Use the AI assistant
  section: AI assistant & MCP
  summary: Browse the catalog, run SQL, and propose worksheet edits with the assistant.
- path: ai/mcp-server.md
  title: MCP server
  section: AI assistant & MCP
  summary: Connecting an AI agent you already use — Claude Code, Cursor — to your data.
- path: ai/connect-mcp-client.md
  title: Connect an MCP client
  section: AI assistant & MCP
  summary: Point Claude Code, Claude Desktop or Cursor at DuckHaven over MCP.
- path: access/how-access-works.md
  title: How access works
  section: Access
  summary: DuckHaven decides what you can do in four independent layers, and a request is allowed
    only if it clears every layer that applies to it.
- path: access/scoped-access.md
  title: Scoped access
  section: Access
  summary: A scoped catalog shows each workspace member only the schemas and tables a grant gives
    them, down to a single table, instead of applying their workspace role to everything.
- path: access/agent-access.md
  title: Agent access
  section: Access
  summary: Agent access decides who may run work on an agent and who may restart or administer it,
    so a team can reserve compute while the rest of the fleet stays open.
- path: access/workspaces.md
  title: Workspaces
  section: Access
  summary: 'A workspace is where a team works: its members and their roles, the catalogs it uses,
    and the worksheets, saved queries and history of everything run in it.'
- path: access/manage-users.md
  title: Manage users & access
  section: Access
  summary: Add people to DuckHaven, give them a global role, and give them a role in the workspaces
    they work in.
- path: access/service-accounts.md
  title: Service accounts & tokens
  section: Access
  summary: Create a service account, give it access to a workspace, and call the API with its token,
    for CI pipelines, schedulers and other unattended clients.
- path: access/connect-idp.md
  title: Connect an IdP (SSO)
  section: Access
  summary: Let people sign in to DuckHaven through your OpenID Connect identity provider, such as
    Microsoft Entra ID, Okta, Keycloak, Authentik, AWS Cognito or Google Workspace.
- path: access/connect-ldap.md
  title: Connect LDAP / AD
  section: Access
  summary: Let people sign in to DuckHaven with their LDAP or Active Directory credentials on the
    normal login form.
- path: access/offboarding.md
  title: Offboarding & break-glass
  section: Access
  summary: Remove someone's access cleanly when they leave, and keep a way in when your identity provider
    is down.
- path: access/troubleshooting.md
  title: Troubleshoot sign-in and access
  section: Access
  summary: Find the message you see on the setup or login screen, in the results pane, or in an API
    response, then follow what to do.
- path: compute/agents.md
  title: Agents
  section: Compute
  summary: An agent is a process running DuckDB on its own host that connects out to the control plane
    and runs the queries it is sent.
- path: compute/add-agent.md
  title: Add an agent
  section: Compute
  summary: 'Run a static agent on another host: generate a bootstrap snippet, start it with Docker
    Compose, and watch it register.'
- path: compute/runtimes.md
  title: Runtimes
  section: Compute
  summary: A runtime is the DuckDB an agent runs, together with the extensions baked into its image.
- path: compute/elastic-compute.md
  title: Elastic compute
  section: Compute
  summary: Elastic compute starts agents when work arrives and none is running, and stops them after
    they sit idle, so nothing runs, or is billed, between queries.
- path: compute/elastic-docker.md
  title: Elastic compute on a single Docker host
  section: Compute
  summary: Turn on elastic compute with the Docker backend, so DuckHaven starts agent containers on
    the host running your stack when work arrives and removes them when idle.
- path: compute/elastic-azure.md
  title: Elastic compute on Azure
  section: Compute
  summary: Turn on elastic compute with the Azure Container Instances backend, so DuckHaven starts
    agents in your Azure subscription when work arrives and stops them when idle.
- path: compute/scaling.md
  title: Scaling compute
  section: Compute
  summary: Add agents for more capacity, give an agent more memory for heavier queries, or change
    how one agent shares its memory between queries.
- path: compute/agent-monitoring.md
  title: Agent monitoring
  section: Compute
  summary: An agent's Monitoring tab shows whether it was saturated, how its memory and CPU behaved,
    and which queries it ran, over up to a week.
- path: compute/troubleshooting.md
  title: Troubleshoot compute
  section: Compute
  summary: Find the message you see in an agent's log, on the Compute page, or in a query's error,
    then follow what to do.
- path: deployment/install.md
  title: Docker Compose
  section: Deploy
  summary: Deploy the full stack with Docker Compose.
- path: deployment/reverse-proxy-tls.md
  title: Reverse proxy & TLS
  section: Deploy
  summary: Front the stack with a reverse proxy and TLS.
- path: deployment/ducklake.md
  title: Enable DuckLake
  section: Deploy
  summary: DuckLake is a second catalog kind, available by default.
- path: deployment/high-availability.md
  title: High availability
  section: Deploy
  summary: The highly-available topology runs Postgres as a Patroni cluster and several API replicas,
    so the control plane survives losing a database node or an API container.
- path: deployment/azure-terraform.md
  title: Azure with Terraform
  section: Deploy
  summary: Deploy the whole stack to Azure as managed infrastructure, with Terraform.
- path: deployment/updating.md
  title: Updating
  section: Deploy
  summary: Updates pull a new image and restart the stack.
- path: deployment/backup-restore.md
  title: Backup & restore
  section: Deploy
  summary: Back up DuckHaven's three Postgres databases and its secret key, restore them, and upgrade
    Postgres to a new major version without losing data.
- path: operations/monitoring.md
  title: Monitoring
  section: Operate
  summary: DuckHaven exports Prometheus metrics for alerting, records every query in History, and
    gives each agent a monitoring page.
- path: operations/tracing.md
  title: Distributed tracing
  section: Operate
  summary: DuckHaven emits OpenTelemetry traces alongside the Prometheus metrics.
- path: operations/ha-failover.md
  title: HA failover runbook
  section: Operate
  summary: Drills that prove the highly-available control plane survives the failures it is designed
    for.
- path: operations/troubleshooting.md
  title: Troubleshoot the deployment
  section: Operate
  summary: Find what you see on the control-plane host, behind your proxy or on the network, then
    follow what to do.
- path: reference/configuration.md
  title: Configuration
  section: Reference
  summary: Every DuckHaven environment variable, with its default and what it changes.
- path: reference/sql-support.md
  title: SQL support
  section: Reference
  summary: DuckHaven runs DuckDB SQL, checked against an allowlist before an agent runs it; statements
    such as ATTACH, INSTALL and SET are rejected.
- path: reference/permissions.md
  title: Permissions
  section: Reference
  summary: Every global permission, workspace role, data-grant tier and agent tier in DuckHaven, and
    what each one allows.
- path: reference/agent-configuration.md
  title: Agent configuration
  section: Reference
  summary: Every environment variable an agent reads; an agent needs only CONTROL_PLANE_URL and BOOTSTRAP_TOKEN.
- path: reference/cli.md
  title: CLI reference
  section: Reference
  summary: Every dh command, its summary and its flags.
- path: reference/rest-api.md
  title: REST API
  section: Reference
  summary: DuckHaven's REST API, under /api, does everything the web UI does, so any task can be scripted
    with a token.
- path: reference/sql-sessions-api.md
  title: SQL sessions API
  section: Reference
  summary: The endpoints a driver uses to open a SQL session, run statements in it, stage files and
    close it.
- path: reference/api-versions.md
  title: API versions
  section: Reference
  summary: GET /api/version reports api_version, an integer that changes only when a change breaks
    existing API clients.
- path: reference/errors.md
  title: Errors
  section: Reference
  summary: Every API error has an HTTP status and a stable error code; this page lists each code,
    what causes it and what to do.
- path: reference/operator-scripts.md
  title: Operator scripts
  section: Reference
  summary: The helper scripts under scripts/ back up Postgres, check DuckLake catalogs, review the
    assistant's answers and wait for the stack to start.
