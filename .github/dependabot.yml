version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  # Dockerfiles pin the Chainguard images by digest (cgr.dev rebuilds :latest
  # continuously) — this keeps those pins from going stale.
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: "docker"
    directory: "/agent"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # DuckHaven's own images — tagged by release.yml, not a third-party
      # dependency for Dependabot to track.
      - dependency-name: "ghcr.io/tamasmrtn/duckhaven-api"
      - dependency-name: "ghcr.io/tamasmrtn/duckhaven-agent"
