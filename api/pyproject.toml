[project]
name = "duckhaven-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "bcrypt>=4.0",
    "websockets>=13",
    "pydantic-settings>=2.0",
    "duckhaven-shared",
    "httpx>=0.28",
    "duckdb>=1.5",
    "authlib>=1.3",
    "ldap3>=2.9",
    "itsdangerous>=2.0",
]

[tool.uv.sources]
duckhaven-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
