name: Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  build-api:
    name: Build duckhaven-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/duckhaven-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            DUCKHAVEN_APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One agent image per runtime (duckhaven_shared.runtimes): a DuckDB line plus
  # its extension set. Read from the manifest so the matrix cannot drift from it.
  agent-runtimes:
    name: List agent runtimes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.runtimes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: runtimes
        run: echo "matrix=$(python3 scripts/runtime_matrix.py)" >> "$GITHUB_OUTPUT"

  build-agent:
    name: Build duckhaven-agent (DuckDB ${{ matrix.runtime }})
    needs: [agent-runtimes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.agent-runtimes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The release version the agent reports, computed exactly as the API's so
      # the two agree; never pushed.
      - uses: docker/metadata-action@v6
        id: app
        with:
          images: duckhaven-agent
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      # Every runtime gets `-duckdb<id>`-suffixed tags, which is what the API
      # provisions. The default runtime also keeps the unsuffixed tags, so static
      # agents that pull `:latest` or `:1.4.0` get what they always have.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/duckhaven-agent
          tags: |
            type=semver,pattern={{version}},suffix=-duckdb${{ matrix.runtime }}
            type=semver,pattern={{major}}.{{minor}},suffix=-duckdb${{ matrix.runtime }}
            type=semver,pattern={{major}},suffix=-duckdb${{ matrix.runtime }}
            type=raw,value=latest-duckdb${{ matrix.runtime }},enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ matrix.default }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.default }}
            type=semver,pattern={{major}},enable=${{ matrix.default }}
            type=raw,value=latest,enable=${{ matrix.default && github.ref_name == github.event.repository.default_branch }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            DUCKHAVEN_RUNTIME=${{ matrix.runtime }}
            DUCKHAVEN_APP_VERSION=${{ steps.app.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent-${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=agent-${{ matrix.runtime }}
