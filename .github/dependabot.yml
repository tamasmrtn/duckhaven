version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # DuckHaven's own images — tagged by release.yml, not a third-party
      # dependency for Dependabot to track.
      - dependency-name: "ghcr.io/tamasmrtn/duckhaven-api"
      - dependency-name: "ghcr.io/tamasmrtn/duckhaven-agent"
      # minio/minio's community Docker images were discontinued (last tag
      # RELEASE.2025-09-07T16-13-09Z) — nothing new will ever be published.
      - dependency-name: "minio/minio"
