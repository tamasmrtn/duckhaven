[project]
name = "duckhaven-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.7",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "bcrypt>=4.0",
    "websockets>=16.1",
    "pydantic-settings>=2.0",
    "duckhaven-shared",
    "httpx>=0.28",
    "duckdb>=1.5",
    # DuckDB's Python client imports pytz to attach tzinfo when materializing a
    # TIMESTAMP WITH TIME ZONE cell (decode_parquet_page); it isn't pulled in
    # transitively, so bundle it explicitly. See issue #162.
    "pytz>=2024.1",
    "authlib>=1.3",
    "ldap3>=2.9",
    "itsdangerous>=2.0",
    "boto3>=1.34",
    "azure-storage-blob>=12.19",
    "azure-identity>=1.16",
    # Azure Container Instances management, for the elastic-compute azure_aci
    # backend. Imported lazily (only when elastic_provider="azure_aci"), so the
    # null-backend path and tests don't require it.
    "azure-mgmt-containerinstance>=10.1",
    # Docker Engine API client, for the elastic-compute docker backend on a
    # single host. Imported lazily on the same rationale as the Azure SDK above.
    "docker>=7.1",
    "fastavro>=1.9",
    "prometheus-client>=0.20",
    "croniter>=3.0",
    "sqlglot>=25",
    "pydantic-ai-slim[anthropic,mistral,openai]>=2.19.0",
    "opentelemetry-sdk>=1.36",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
    "opentelemetry-instrumentation-fastapi>=0.57b0",
    "opentelemetry-instrumentation-httpx>=0.57b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.57b0",
]

[tool.uv.sources]
duckhaven-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
