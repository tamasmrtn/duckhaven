name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'deploy/terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'deploy/terraform/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      # Enforced unconditionally here. The pre-commit hook skips when Terraform is
      # absent, so that contributors who never touch this deployment are not required
      # to install it; CI is where that leniency ends.
      - name: Format
        run: terraform fmt -check -recursive

      # Every directory holding .tf files, named explicitly.
      #
      # This used to be a single step run from deploy/terraform, which held the root
      # module directly. It no longer holds any .tf at all -- the deployment moved
      # into modules/ and examples/ -- and `terraform validate` in an empty directory
      # *succeeds*, so the step kept passing while checking nothing. Listing the real
      # directories is what makes a failure possible again.
      #
      # -backend=false: validation needs the providers and modules, not remote state,
      # and CI has no credentials for the state account. A plan would need both.
      - name: Validate
        run: |
          set -eu
          for dir in modules/duckhaven-azure modules/private-endpoint \
                     examples/quickstart examples/production bootstrap; do
            echo "::group::terraform validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      # A directory that holds .tf files but is not in the list above is unvalidated,
      # which is exactly the failure this step replaced. Fail rather than let the next
      # one be added silently.
      - name: Every Terraform directory is covered
        run: |
          set -eu
          printf '%s\n' bootstrap examples/production examples/quickstart \
                        modules/duckhaven-azure modules/private-endpoint \
            | sort > /tmp/tf-validated
          find . -name '*.tf' -not -path './*/.terraform/*' -exec dirname {} \; \
            | sed 's|^\./||' | sort -u > /tmp/tf-found
          if ! diff -u /tmp/tf-validated /tmp/tf-found; then
            echo "Terraform directories changed; add the new one to the Validate step above."
            exit 1
          fi

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      # TFLINT_CONFIG_FILE must be absolute: with --recursive tflint changes into each
      # subdirectory and looks for a config there, so bootstrap/ and modules/ would
      # otherwise be linted with no azurerm plugin and wrongly report clean.
      - name: TFLint
        env:
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/deploy/terraform/.tflint.hcl
        run: |
          tflint --init
          tflint --recursive
