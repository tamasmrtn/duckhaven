# Grafana Tempo, single-instance, local disk storage. Receives OTLP from the
# collector only; query it via Grafana (dev compose) or any Tempo datasource
# pointed at http://tempo:3200.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Tempo 3.x replaced the `compactor` block with a backend scheduler and worker
# that run in-process in this single-binary setup. Block retention is a worker
# setting (the scheduler has a copy of the key that does nothing); without it
# blocks are kept for 14 days rather than 72h.
backend_worker:
  compaction:
    block_retention: 72h
