services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: duckhaven
      POSTGRES_USER: duckhaven
      # Internal-only password (Postgres publishes no port). Shared with the
      # polaris and api services via compose interpolation so they all agree;
      # override in .env for a non-default deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duckhaven}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the dedicated `polaris` database on first init.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckhaven"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bundled S3-compatible object store. Backs the object_store catalogs (and is
  # the storage Polaris vends credentials for). Its :9000 endpoint must be
  # reachable by remote agents — that is the URL Polaris vends to DuckDB, set
  # via S3_ENDPOINT (defaults to the in-network minio:9000; set to the host's
  # address when running agents on other hosts). The entrypoint pre-creates the
  # warehouse bucket as a top-level directory (MinIO registers it as a bucket),
  # folding in the former minio-bootstrap one-shot.
  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p "/data/${S3_BUCKET:-warehouse}" && exec minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-warehouse}
    volumes:
      - minio_data:/data

  # One-shot: create Polaris's relational-jdbc schema + root principal in the
  # dedicated `polaris` database. Idempotent: the wrapper treats the admin
  # tool's "realm already exists" exit (3) as success, so re-running `up`/`start`
  # is a no-op rather than blocking the dependent services. Stays a separate
  # service because the admin tool ships as its own image (the polaris server
  # image does not include it).
  polaris-bootstrap:
    image: apache/polaris-admin-tool:${POLARIS_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: duckhaven
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-duckhaven}
    volumes:
      - ./polaris-bootstrap.sh:/polaris-bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/polaris-bootstrap.sh"]
    command:
      - java
      - -jar
      - /deployments/polaris-admin-tool.jar
      - bootstrap
      - --realm=${POLARIS_REALM:-POLARIS}
      - --credential=${POLARIS_REALM:-POLARIS},${POLARIS_CLIENT_ID:-root},${POLARIS_CLIENT_SECRET:-s3cr3t}
    restart: "no"

  polaris:
    image: apache/polaris:${POLARIS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: duckhaven
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-duckhaven}
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM:-POLARIS}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # Polaris signs/vends S3 credentials using these to reach the bundled
      # MinIO. ALLOW_INSECURE_STORAGE_TYPES is needed for a custom http endpoint.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${S3_REGION:-us-east-1}
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"S3\"]"
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    image: ghcr.io/tamasmrtn/duckhaven-api:${DUCKHAVEN_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      polaris:
        condition: service_healthy
    environment:
      # Captured to the secrets dir (inside api_data) on first boot by the
      # entrypoint and reused thereafter; the postgres password is shared with
      # the postgres/polaris services via compose interpolation.
      SECRET_KEY: ${SECRET_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duckhaven}
      POLARIS_BASE_URL: http://polaris:8181
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-s3cr3t}
      # Bundled MinIO backing object_store catalogs. S3_ENDPOINT is vended to
      # agents; it defaults to the in-network minio:9000 so the bundled agent
      # works out of the box. Set it to a host-reachable address when running
      # agents on other hosts. S3_ENDPOINT_INTERNAL is what Polaris uses inside
      # the compose network.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ENDPOINT_INTERNAL: ${S3_ENDPOINT_INTERNAL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-warehouse}
      # Single-use token the API seeds on startup so the bundled agent can
      # auto-register without an operator minting one in the admin UI (folds in
      # the former agent-bootstrap one-shot; idempotent re-seed on restart).
      AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:-dh_boot_localdev_seed}
      # Plain-HTTP deployment by default; the browser drops Secure cookies over
      # HTTP, which would break login. Set true only behind a TLS terminator.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # secret_key + setup_token live under this mount (/var/duckhaven/secrets
      # and /var/duckhaven), generated by the entrypoint on first boot.
      - api_data:/var/duckhaven
    healthcheck:
      # Use python stdlib so the image stays curl-free.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/healthz', timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Bundled DuckHaven compute agent. Dials the API control plane over WebSocket,
  # exchanges the seeded bootstrap token for a session credential, advertises its
  # DuckDB capabilities, and executes dispatched queries. The result server binds
  # 0.0.0.0 (Bearer-gated) so the API can fetch result Parquet across the network.
  # The API seeds the bootstrap token during its own startup, so a healthy api is
  # sufficient — no separate bootstrap service to wait on.
  agent:
    image: ghcr.io/tamasmrtn/duckhaven-agent:${DUCKHAVEN_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Memory cap so the cgroup-aware detection has a concrete memory.max to read
    # end to end. Remove or raise via AGENT_MEM_LIMIT= for an unconstrained agent
    # that advertises full host RAM.
    mem_limit: ${AGENT_MEM_LIMIT:-4g}
    depends_on:
      api:
        condition: service_healthy
    environment:
      CONTROL_PLANE_URL: ws://api:8000/agents/connect
      BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:-dh_boot_localdev_seed}
      AGENT_NAME: TestAgent-1
      POLARIS_BASE_URL: http://polaris:8181
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-s3cr3t}
      # The control plane reaches the result server across the compose network,
      # so bind all interfaces rather than loopback.
      RESULTS_HTTP_HOST: 0.0.0.0
    volumes:
      - agent_results:/var/duckhaven-agent/results
    healthcheck:
      # Result server up = agent process alive. Stdlib so the image stays curl-free.
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; s=socket.create_connection(('127.0.0.1',8001),2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  api_data:
  minio_data:
  agent_results:
