name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run migrations
        run: uv run alembic upgrade head
        working-directory: api
      - name: Run tests
        run: |
          uv run pytest \
            --cov=api/src --cov=agent/src \
            --cov-config=pyproject.toml \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
      - name: Coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        if: always()
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Python Coverage
          badge-title: Python Cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml

  frontend-check:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: web
      - name: Run tests with coverage
        run: npm run test -- --coverage
        working-directory: web
      - name: Coverage comment
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/

  compose-validate:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f deploy/docker-compose.yml config --quiet
