[tool.uv.workspace]
members = ["api", "agent", "shared"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6.1",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "httpx-ws>=0.9.0",
    "respx>=0.23.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["api", "agent", "duckhaven_shared"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy cross-model forward references are resolved via the mapper registry
"api/src/api/models/*.py" = ["F821"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests/unit", "agent/tests/unit", "shared/tests/unit"]
# Expose tests/'s children as top-level importable modules (testkit, ...) so
# the shared kit imports cleanly from per-package runs without sys.path hacks
# and without colliding with each service's own `tests` package.
pythonpath = ["tests"]
markers = [
    "integration: integration tests requiring external services (UC, Postgres). Opt-in via `make test-integration`.",
    "cross_component: live API+agent tests over the control channel. Opt-in via `make test-cross-component`.",
]

[tool.coverage.run]
branch = true
# Python 3.12+ sys.monitoring core; far cheaper tracing than the default
# bytecode-rewriting CTracer (see Trail of Bits' PyPI-suite writeup).
core = "sysmon"
omit = [
    "*/main.py",
    "*/config.py",
    "api/src/api/db/session.py",
    "api/src/api/db/base.py",
    "api/alembic/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
