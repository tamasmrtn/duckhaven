services:
  # One-shot: generate SECRET_KEY and POSTGRES_PASSWORD on first boot. Reuses
  # the api image so the compose stack has a single base. Idempotent — on
  # subsequent boots the files already exist and the script no-ops.
  init-secrets:
    image: ghcr.io/tamasmrtn/duckhaven-api:${DUCKHAVEN_IMAGE_TAG:-latest}
    entrypoint: ["/usr/local/bin/init-secrets.sh"]
    environment:
      # Honour operator-supplied overrides if .env sets them; otherwise the
      # script generates random values.
      SECRET_KEY: ${SECRET_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - secrets:/var/duckhaven/secrets
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: duckhaven
      POSTGRES_USER: duckhaven
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckhaven"]
      interval: 5s
      timeout: 5s
      retries: 5

  unity-catalog:
    image: unitycatalog/unitycatalog:v0.4.0
    restart: unless-stopped
    environment:
      UC_SERVER_PORT: "8080"
    volumes:
      - uc_data:/etc/unitycatalog
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/2.1/unity-catalog/catalogs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/tamasmrtn/duckhaven-api:${DUCKHAVEN_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      UC_BASE_URL: http://unity-catalog:8080
      # Plain-HTTP deployment by default; the browser drops Secure cookies over
      # HTTP, which would break login. Set true only behind a TLS terminator.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - api_data:/var/duckhaven
      - secrets:/var/duckhaven/secrets:ro
    healthcheck:
      # Use python stdlib so the image stays curl-free.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/healthz', timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  uc_data:
  api_data:
  secrets:
