# HAProxy in front of the Patroni Postgres cluster. It exposes a single
# read-write endpoint on :5432 and always routes to the current primary by
# health-checking each node's Patroni REST API: only the leader answers
# `GET /primary` with 200, so a failover transparently repoints traffic.
#
# The API connects to `pg-haproxy:5432`, so `database_url` never changes when the
# primary moves — combined with the app's `pool_pre_ping`, reconnection is
# automatic.

global
    maxconn 200

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect 4s
    timeout server  30m
    timeout check   5s

# Read-write: the single endpoint the control plane uses.
listen postgres_write
    bind *:5432
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 maxconn 100 check port 8008
    server patroni-2 patroni-2:5432 maxconn 100 check port 8008

# Optional: read-only endpoint spreading SELECTs across replicas (the API does
# not use it today, but it documents how read scaling would attach).
listen postgres_read
    bind *:5433
    option httpchk OPTIONS /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 maxconn 100 check port 8008
    server patroni-2 patroni-2:5432 maxconn 100 check port 8008
