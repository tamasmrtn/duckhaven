site_name: DuckHaven
site_description: >-
  Self-hosted, browser-based SQL workspace for DuckDB teams — collaborative
  worksheets, an Apache Iceberg catalog governed by Apache Polaris, and
  multi-agent compute, on your own infrastructure.
site_url: https://tamasmrtn.github.io/duckhaven/
repo_url: https://github.com/tamasmrtn/duckhaven
repo_name: tamasmrtn/duckhaven
edit_uri: edit/main/docs/
copyright: Copyright &copy; DuckHaven Contributors — MIT License

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tamasmrtn/duckhaven
      name: DuckHaven on GitHub

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
  - Concepts:
      - Architecture: concepts/architecture.md
  - Deployment:
      - Install: deployment/install.md
      - Add an agent: deployment/add-agent.md
      - Reverse proxy + TLS: deployment/reverse-proxy-tls.md
      - Updating: deployment/updating.md
      - Backup & restore: deployment/backup-restore.md
  - Administration:
      - Operator runbook: administration/runbook.md
      - Agent reference: administration/agents.md
  - Reference:
      - Configuration: reference/configuration.md
  - Contributing:
      - Development: contributing/development.md
      - Releasing: contributing/releasing.md
      - Design system: contributing/design-system.md
