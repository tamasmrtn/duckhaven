name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Compute which areas changed so heavy jobs only run when relevant. Skipped
  # jobs still report success to the `ci-success` gate below, keeping branch
  # protection green on, e.g., a docs-only or web-only PR.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'api/**'
              - 'agent/**'
              - 'shared/**'
              - 'tests/**'
              - '!tests/e2e/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'tests/e2e/**'
              - 'api/**'
              - 'agent/**'
              - 'web/**'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'deploy/**'
              - 'Makefile'
              - '.github/workflows/**'

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    permissions:
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run migrations
        run: uv run alembic upgrade head
        working-directory: api
      - name: Run API tests
        run: |
          uv run --package duckhaven-api pytest api/tests/unit/ \
            --cov=api/src \
            --cov-config=pyproject.toml \
            --cov-report=
      - name: Run agent tests
        run: |
          uv run --package duckhaven-agent pytest agent/tests/unit/ \
            --cov=agent/src --cov-append \
            --cov-config=pyproject.toml \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Python Coverage
          badge-title: Python Cov
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-coverage
          path: coverage.xml

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [changes, python-test]
    if: needs.changes.outputs.python == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/testdb
      POLARIS_BASE_URL: http://localhost:8181
      POLARIS_CLIENT_ID: root
      POLARIS_CLIENT_SECRET: s3cr3t
      # DuckDB (in-process) reaches MinIO at the vended endpoint on localhost;
      # Polaris (in the dh-polaris-net network started by `make polaris-dev`)
      # reaches MinIO at the dh-minio-dev container name.
      POLARIS_S3_ENDPOINT: http://localhost:9000
      POLARIS_S3_ENDPOINT_INTERNAL: http://dh-minio-dev:9000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run migrations
        run: uv run alembic upgrade head
        working-directory: api
      # Object storage only: stands up MinIO + Polaris-on-S3 so the INSERT
      # roundtrip runs (Polaris vends scoped credentials to DuckDB).
      - name: Start Polaris + MinIO (S3)
        run: make polaris-dev
      - name: Component integration tests (API + agent)
        env:
          POLARIS_S3_BUCKET: s3://warehouse
        run: make test-integration-api test-integration-agent

  cross-component:
    name: Cross-component tests
    runs-on: ubuntu-latest
    needs: [changes, python-test]
    if: needs.changes.outputs.python == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/testdb
      POLARIS_BASE_URL: http://localhost:8181
      POLARIS_CLIENT_ID: root
      POLARIS_CLIENT_SECRET: s3cr3t
      POLARIS_S3_ENDPOINT: http://localhost:9000
      POLARIS_S3_ENDPOINT_INTERNAL: http://dh-minio-dev:9000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Start Polaris + MinIO (S3)
        run: make polaris-dev
      # Boots the real API + agent over the live control channel; the harness
      # applies migrations and creates the first admin itself.
      - name: Cross-component tests
        env:
          POLARIS_S3_BUCKET: s3://warehouse
        run: make test-cross-component

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [changes]
    # Heavy full-stack run: only on merge to main or PRs labelled `run-e2e`,
    # and only when app/e2e code changed.
    if: >-
      (github.event_name == 'push' ||
       contains(github.event.pull_request.labels.*.name, 'run-e2e'))
      && needs.changes.outputs.e2e == 'true'
    env:
      DUCKHAVEN_IMAGE_TAG: ci-e2e
      DH_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build branch images (SPA is baked into the API image) so E2E exercises
      # this branch's code, not the published :latest tags.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          load: true
          tags: ghcr.io/tamasmrtn/duckhaven-api:ci-e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          load: true
          tags: ghcr.io/tamasmrtn/duckhaven-agent:ci-e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the full stack
        run: make compose-up
      - name: Wait for the stack to be healthy
        run: ./scripts/wait-for-stack.sh
      - name: Capture the first-boot setup token
        run: |
          token=$(docker compose -f deploy/docker-compose.yml exec -T api \
            cat /var/duckhaven/setup_token)
          echo "DH_SETUP_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
      - name: Run E2E
        run: make test-e2e
      - name: Capture compose logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            compose-logs.txt

  frontend-check:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm install
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm install
        working-directory: web
      - name: Run tests with coverage
        run: npm run test -- --coverage
        working-directory: web
      - name: Coverage comment
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/

  compose-validate:
    name: Validate compose file
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/docker-compose.yml config --quiet

  # Single required status check for branch protection: green when no job
  # failed (path-skipped jobs report "skipped", which is allowed).
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - python-lint
      - python-test
      - integration
      - cross-component
      - e2e
      - frontend-check
      - frontend-test
      - compose-validate
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not succeed."
              exit 1
            fi
          done
          echo "All required jobs succeeded or were skipped."
