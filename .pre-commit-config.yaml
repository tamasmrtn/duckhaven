repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        # mkdocs.yml uses Python-object YAML tags (!!python/name:...) that the
        # safe loader can't construct; mkdocs validates it on build instead.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.17.0
    hooks:
      - id: markdownlint
        # The docs landing page is an MkDocs Material template page that relies
        # on inline HTML (grid cards) and YAML front matter; mdl can't parse it.
        exclude: ^docs/index\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        language: system
        entry: bash -c 'cd web && npx prettier --write src/'
        files: ^web/src/.*\.(ts|tsx|css)$
        pass_filenames: false

      - id: eslint
        name: ESLint
        language: system
        entry: bash -c 'cd web && npx eslint --fix .'
        files: ^web/src/.*\.[tj]sx?$
        pass_filenames: false

      # Formatting only: `terraform validate` needs an initialised working directory
      # (provider plugins downloaded), which is a CI concern rather than a per-commit
      # one. Skips when Terraform is absent so contributors who never touch the Azure
      # deployment are not forced to install it; CI enforces fmt unconditionally.
      - id: terraform-fmt
        name: terraform fmt
        language: system
        entry: bash -c 'command -v terraform >/dev/null || { echo "terraform not on PATH; skipping"; exit 0; }; cd deploy/terraform && terraform fmt -check -recursive'
        files: ^deploy/terraform/.*\.tf$
        pass_filenames: false

      - id: commitlint
        name: commitlint
        language: node
        entry: commitlint --edit
        stages: [commit-msg]
        additional_dependencies:
          - '@commitlint/cli@19'
          - '@commitlint/config-conventional@19'
