services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: duckhaven
      POSTGRES_USER: duckhaven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckhaven"]
      interval: 5s
      timeout: 5s
      retries: 5

  unity-catalog:
    image: unitycatalog/unitycatalog:v0.4.0
    restart: unless-stopped
    environment:
      UC_SERVER_PORT: "8080"
    volumes:
      - uc_data:/etc/unitycatalog
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/2.1/unity-catalog/catalogs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    # Built from the repo root so the Dockerfile can bundle the web UI
    # (web/) and shared/ alongside the API. Image is tagged for reuse.
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: duckhaven-api:0.1.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://duckhaven:${POSTGRES_PASSWORD}@postgres:5432/duckhaven
      UC_BASE_URL: http://unity-catalog:8080
      SECRET_KEY: ${SECRET_KEY}
      # Plain-HTTP deployment by default; the browser drops Secure cookies over
      # HTTP, which would break login. Set true only behind a TLS terminator.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - api_data:/var/duckhaven

volumes:
  postgres_data:
  uc_data:
  api_data:
