# Compute sizing (METHODOLOGY.md §7). One fixed tier, used at every scale
# factor in scope (SF1/SF10/SF100/SF300) — not a $/hr-matched tier that
# scales up with data the way an earlier, since-retired plan to deploy
# DuckHaven to paid Azure infrastructure would have used. None of the
# three trial accounts/setups here can be resized, so there is nothing to
# scale: sizing is each platform's practical floor under this specific
# trial, not a spec or a rate match:
#   - Snowflake: SNOWFLAKE_LEARNING_WH is a fixed X-Small on this trial
#     account — confirmed no MODIFY grant to resize it (2026-08-07).
#   - Databricks: the trial workspace's Serverless Starter Warehouse, set
#     to 2X-Small (its floor) to sit as close to Snowflake's fixed
#     X-Small as either platform's tier names get.
#   - DuckHaven: an elastic agent pinned via DUCKHAVEN_AGENT_ID at
#     (2 vCPU, 4 GB) — the platform's own stated default size
#     (ELASTIC_DEFAULT_CPU/MEMORY_GB). DuckHaven's Docker backend could
#     run a bigger agent, but sizing it up while the other two stay
#     pinned to their floor would stop being a comparison of comparable
#     compute — see METHODOLOGY.md §7 for the full reasoning.
#
# The name is a holdover from when this tier was Phase-0-only; it now
# applies to every scale factor in scope, including SF100 and SF300 —
# which is deliberate: it's what shows how each engine's smallest
# practical tier handles 100x-300x the SF1 data, not a gap to fill in
# later with a bigger tier.

tiers:
  phase0_trial:
    snowflake_warehouse_size: X-Small
    databricks_warehouse_size: 2X-Small
    duckhaven_target: { cpu: 2.0, memory_gb: 4.0 }
    used_for_sf: [sf1, sf10, sf100, sf300]
