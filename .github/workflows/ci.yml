name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run migrations
        run: uv run alembic upgrade head
        working-directory: api
      - name: Run API tests
        run: |
          uv run --package duckhaven-api pytest api/tests/unit/ \
            --cov=api/src \
            --cov-config=pyproject.toml \
            --cov-report=
      - name: Run agent tests
        run: |
          uv run --package duckhaven-agent pytest agent/tests/unit/ \
            --cov=agent/src --cov-append \
            --cov-config=pyproject.toml \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
      - name: Coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Python Coverage
          badge-title: Python Cov
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-coverage
          path: coverage.xml

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [python-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      polaris:
        image: apache/polaris:latest
        # In-memory persistence + auto-bootstrap from these credentials; FILE
        # storage allowed for the integration smoke tests.
        env:
          POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
          POLARIS_REALM_CONTEXT_REALMS: POLARIS
          QUARKUS_OTEL_SDK_DISABLED: "true"
          polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
          polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"FILE\"]"
          polaris.readiness.ignore-severe-issues: "true"
        options: >-
          --health-cmd "curl --fail http://localhost:8182/q/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          -v /tmp:/tmp
        ports:
          - 8181:8181
          - 8182:8182
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/testdb
      POLARIS_BASE_URL: http://localhost:8181
      POLARIS_CLIENT_ID: root
      POLARIS_CLIENT_SECRET: s3cr3t
      # Shared with the Polaris container via the `-v /tmp:/tmp` mount above, so
      # the agent FILE-storage read test can reach catalog metadata Polaris writes.
      POLARIS_WAREHOUSE_DIR: /tmp/dh-warehouse
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run migrations
        run: uv run alembic upgrade head
        working-directory: api
      - name: Integration tests
        run: make test-integration

  frontend-check:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
        working-directory: web
      - name: Run tests with coverage
        run: npm run test -- --coverage
        working-directory: web
      - name: Coverage comment
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          working-directory: web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/

  compose-validate:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f deploy/docker-compose.yml config --quiet
