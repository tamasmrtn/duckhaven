# Named configurations of the assistant, for the harness to run.
#
#   make eval-compare ARM_A=with-docs ARM_B=baseline
#
# Set openai_base_url to http://localhost:11434/v1 to go through a local Ollama
# daemon rather than ollama.com.

# The two comparison arms. They share a model, an endpoint and a workspace, so
# the only difference between them is the knowledge — which is what makes a win
# attributable to it. Change one and change the other.
baseline:
  docs_enabled: false
  model: "glm-5.3-flash:cloud"
  openai_base_url: "https://ollama.com/v1"
  workspace:
    semantic_summary: "  - sales (12 metrics) — Orders and revenue."
    can_write: false

with-docs:
  docs_enabled: true
  model: "glm-5.3-flash:cloud"
  openai_base_url: "https://ollama.com/v1"
  workspace:
    semantic_summary: "  - sales (12 metrics) — Orders and revenue."
    can_write: false

# Not a comparison arm. Every conditional block on at once, so the prompt-budget
# ceiling is measured against the largest prompt the product can produce rather
# than the smallest, and can_write on so the write-approval path is reachable.
everything:
  inherits: with-docs
  workspace:
    semantic_summary: "  - sales (12 metrics) — Orders and revenue."
    storage_kinds: [s3, adls_gen2]
    elastic_enabled: true
    agent_count: 3
    can_write: true

# "Is the cheaper model good enough here?" — run it against with-docs. Names a
# model that has actually been exercised against this harness; an arm pointing
# at something unverified is a failed run waiting to happen.
cheaper-model:
  inherits: with-docs
  model: "deepseek-v4-flash:cloud"
