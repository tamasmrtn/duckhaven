site_name: DuckHaven
site_description: >-
  A self-hosted data lakehouse built on DuckDB, Apache Iceberg and Apache
  Polaris — collaborative worksheets, a governed catalog, elastic compute,
  column-level lineage, a semantic layer, scoped access grants, single sign-on,
  and governed AI access, on your own infrastructure.
site_url: https://tamasmrtn.github.io/duckhaven/
repo_url: https://github.com/tamasmrtn/duckhaven
repo_name: tamasmrtn/duckhaven
edit_uri: edit/main/docs/
copyright: Copyright &copy; DuckHaven Contributors — AGPLv3 License

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  # Dark is the default (slate is listed first); a custom toggle
  # (javascripts/theme-switch.js) switches between dark and light.
  palette:
    - scheme: slate
      primary: black
      accent: deep purple
    - scheme: default
      primary: black
      accent: deep purple

# `--strict` promotes warnings to errors, but anchor validation defaults to
# `info`, which it does not promote — so a link to a heading that has been
# renamed or removed breaks silently. The docs cross-link heavily by anchor
# (and the assistant serves these pages at runtime), so make that an error.
validation:
  anchors: warn

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/theme-switch.js

# Fragments included into several pages with --8<-- (see docs/developer/
# writing-docs.md). Excluded so they are not built as pages of their own.
exclude_docs: |
  _snippets/

plugins:
  - search
  # One entry per moved or merged page: old path -> new path. Keep it flat (no
  # chains); `make docs-index` turns it into the assistant's path aliases.
  - redirects:
      redirect_maps:
        getting-started/installation.md: getting-started/quickstart.md
        getting-started/first-workspace.md: getting-started/quickstart.md#3-create-a-workspace
        getting-started/first-query.md: getting-started/quickstart.md#5-create-a-table-and-query-it
        concepts/what-is-duckhaven.md: getting-started/what-is-duckhaven.md
        concepts/architecture.md: getting-started/how-duckhaven-works.md
        concepts/workspaces.md: access/workspaces.md
        concepts/permissions.md: access/permissions.md
        concepts/catalogs.md: data/catalogs.md
        concepts/tables.md: data/tables.md
        concepts/ducklake.md: data/ducklake.md
        concepts/storage-backends.md: data/storage-backends.md
        concepts/maintenance.md: data/maintenance.md
        concepts/agents.md: compute/agents.md
        concepts/elastic-compute.md: compute/elastic-compute.md
        concepts/runtimes.md: compute/runtimes.md
        concepts/query-execution.md: querying/query-execution.md
        concepts/result-cache.md: querying/result-cache.md
        concepts/sql-sessions.md: querying/sql-sessions.md
        concepts/assistant.md: ai/assistant.md
        concepts/mcp-server.md: ai/mcp-server.md
        concepts/lineage.md: metadata/lineage.md
        concepts/semantic-layer.md: metadata/semantic-layer.md
        concepts/metadata.md: metadata/table-metadata.md
        deployment/add-agent.md: compute/add-agent.md
        deployment/homelab-elastic-setup.md: compute/elastic-docker.md
        deployment/azure-elastic-setup.md: compute/elastic-azure.md
        deployment/storage.md: data/configure-storage.md
        guides/run-queries.md: querying/run-queries.md
        guides/query-profiles.md: querying/query-profiles.md
        guides/saved-queries.md: querying/saved-queries.md
        guides/schedule-queries.md: querying/schedule-queries.md
        guides/session-audit.md: querying/session-audit.md
        guides/manage-catalogs.md: data/manage-catalogs.md
        guides/create-a-ducklake-catalog.md: data/create-a-ducklake-catalog.md
        guides/migrate-catalog-storage.md: data/migrate-catalog-storage.md
        guides/snapshots-time-travel.md: data/snapshots-time-travel.md
        guides/import-dbt-lineage.md: metadata/import-dbt-lineage.md
        guides/define-metrics.md: metadata/define-metrics.md
        guides/import-dbt-semantics.md: metadata/import-dbt-semantics.md
        guides/using-the-assistant.md: ai/use-the-assistant.md
        guides/connect-mcp-client.md: ai/connect-mcp-client.md
        guides/access-levels.md: access/access-levels.md
        guides/users-access.md: access/manage-users.md
        guides/service-accounts.md: access/service-accounts.md
        guides/connect-idp.md: access/connect-idp.md
        guides/connect-ldap.md: access/connect-ldap.md
        operations/agent-monitoring.md: compute/agent-monitoring.md
        operations/scaling.md: compute/scaling.md
        operations/offboarding.md: access/offboarding.md
        operations/storage-maintenance.md: data/storage-maintenance.md
  - social:
      cards_layout_options:
        background_color: "#0b0f19"
        color: "#ffffff"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/_snippets]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tamasmrtn/duckhaven
      name: DuckHaven on GitHub

