name: Security Scan

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  trivy-api:
    name: Scan duckhaven-api
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: duckhaven-api:scan
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: duckhaven-api:scan
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

  agent-runtimes:
    name: List agent runtimes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.runtimes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: runtimes
        run: echo "matrix=$(python3 scripts/runtime_matrix.py)" >> "$GITHUB_OUTPUT"

  # Every runtime is its own image with its own DuckDB and extension binaries,
  # so each is scanned.
  trivy-agent:
    name: Scan duckhaven-agent (DuckDB ${{ matrix.runtime }})
    needs: [agent-runtimes]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.agent-runtimes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          push: false
          load: true
          build-args: |
            DUCKHAVEN_RUNTIME=${{ matrix.runtime }}
          tags: duckhaven-agent:scan
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: duckhaven-agent:scan
          format: sarif
          output: trivy-agent.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-agent.sarif
          category: trivy-agent-${{ matrix.runtime }}
