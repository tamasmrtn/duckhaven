services:
  # One-shot: generate SECRET_KEY and POSTGRES_PASSWORD on first boot. Reuses
  # the api image so the compose stack has a single base. Idempotent — on
  # subsequent boots the files already exist and the script no-ops.
  init-secrets:
    image: ghcr.io/tamasmrtn/duckhaven-api:${DUCKHAVEN_IMAGE_TAG:-latest}
    entrypoint: ["/usr/local/bin/init-secrets.sh"]
    environment:
      # Honour operator-supplied overrides if .env sets them; otherwise the
      # script generates random values.
      SECRET_KEY: ${SECRET_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - api_data:/var/duckhaven
      - secrets:/var/duckhaven/secrets
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: duckhaven
      POSTGRES_USER: duckhaven
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - secrets:/run/secrets:ro
      # Creates the dedicated `polaris` database on first init.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckhaven"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bundled S3-compatible object store. Backs the local_fs/nas catalogs (and is
  # the storage Polaris vends credentials for). Its :9000 endpoint must be
  # reachable by remote agents — that is the URL Polaris vends to DuckDB, set
  # via S3_ENDPOINT (default localhost; set to the host's address in prod).
  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  # One-shot: create the warehouse bucket once MinIO is reachable. Mirrors the
  # polaris-bootstrap pattern; idempotent via `mc mb --ignore-existing`.
  minio-bootstrap:
    image: minio/mc:${MINIO_MC_IMAGE_TAG:-latest}
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-warehouse}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        do echo 'waiting for minio...'; sleep 1; done;
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

  # One-shot: create Polaris's relational-jdbc schema + root principal in the
  # dedicated `polaris` database. Idempotent on the same realm/credentials.
  polaris-bootstrap:
    image: apache/polaris-admin-tool:${POLARIS_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: duckhaven
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-duckhaven}
    command:
      - bootstrap
      - --realm=${POLARIS_REALM:-POLARIS}
      - --credential=${POLARIS_REALM:-POLARIS},${POLARIS_CLIENT_ID:-root},${POLARIS_CLIENT_SECRET:-s3cr3t}
    restart: "no"

  polaris:
    image: apache/polaris:${POLARIS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: duckhaven
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-duckhaven}
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM:-POLARIS}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # Polaris signs/vends S3 credentials using these to reach the bundled
      # MinIO. ALLOW_INSECURE_STORAGE_TYPES is needed for a custom http endpoint.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${S3_REGION:-us-east-1}
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"S3\"]"
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    image: ghcr.io/tamasmrtn/duckhaven-api:${DUCKHAVEN_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      polaris:
        condition: service_healthy
    environment:
      POLARIS_BASE_URL: http://polaris:8181
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-s3cr3t}
      # Bundled MinIO backing local_fs/nas catalogs. S3_ENDPOINT is vended to
      # remote agents (must be reachable by them); the internal endpoint is what
      # Polaris uses inside the compose network.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_ENDPOINT_INTERNAL: ${S3_ENDPOINT_INTERNAL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-warehouse}
      # Plain-HTTP deployment by default; the browser drops Secure cookies over
      # HTTP, which would break login. Set true only behind a TLS terminator.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - api_data:/var/duckhaven
      - secrets:/var/duckhaven/secrets:ro
    healthcheck:
      # Use python stdlib so the image stays curl-free.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/healthz', timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  api_data:
  minio_data:
  secrets:
