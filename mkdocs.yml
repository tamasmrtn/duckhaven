site_name: DuckHaven
site_description: >-
  Self-hosted, governed DuckDB + Iceberg analytics platform for small teams —
  collaborative worksheets, scoped access grants, service-account machine auth,
  an AI data assistant, scheduled queries, catalog governance via Apache
  Polaris, lakehouse maintenance, and multi-agent compute, on your own
  infrastructure.
site_url: https://tamasmrtn.github.io/duckhaven/
repo_url: https://github.com/tamasmrtn/duckhaven
repo_name: tamasmrtn/duckhaven
edit_uri: edit/main/docs/
copyright: Copyright &copy; DuckHaven Contributors — MIT License

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  # Dark is the default (slate is listed first); a custom toggle
  # (javascripts/theme-switch.js) switches between dark and light.
  palette:
    - scheme: slate
      primary: black
      accent: deep purple
    - scheme: default
      primary: black
      accent: deep purple

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/theme-switch.js

plugins:
  - search
  - social:
      cards_layout_options:
        background_color: "#0b0f19"
        color: "#ffffff"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tamasmrtn/duckhaven
      name: DuckHaven on GitHub

