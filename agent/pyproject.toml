[project]
name = "duckhaven-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5",
    "websockets>=13",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "duckhaven-shared",
    "starlette>=0.40",
    "uvicorn>=0.50.2",
    "psutil>=7.0.0",
    "certifi>=2024.0",
]

[tool.uv.sources]
duckhaven-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
