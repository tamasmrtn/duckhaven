# Prose lint for docs/. The DuckHaven style encodes the rules in
# docs/developer/writing-docs.md; the reasons behind each rule are there too.
# Levels start lenient (warnings), and each subject folder is made strict in
# the section at the bottom once its pages have been rewritten.
StylesPath = .vale/styles
Vocab = DuckHaven
MinAlertLevel = suggestion

[docs/**/*.md]
BasedOnStyles = Vale, DuckHaven
# Product, SQL and Python identifiers make spelling checks mostly noise.
Vale.Spelling = NO
# GitHub references such as duckdb/ducklake#1278 are names, not prose, and
# double-quoted text is an exact message or label the page quotes.
TokenIgnores = [\w.-]+/[\w.-]+#\d+, "[^"\n]+"

# Contributor docs and release notes describe change over time by design.
[docs/{developer,release-notes}/**/*.md]
DuckHaven.Changelog = NO
DuckHaven.FuturePromises = NO

# Generated from the CLI's command tree in duckhaven-clients; edits here are
# overwritten, so it is not linted.
[docs/reference/cli.md]
BasedOnStyles =

# Subject folders rewritten to the templates in docs/developer/writing-docs.md.
# Here the rules that keep pages current and plain are errors, not warnings.
[docs/{getting-started,access,querying,data,compute}/**/*.md]
DuckHaven.Changelog = error
DuckHaven.FuturePromises = error
DuckHaven.Weasel = error

# Reference pages rewritten so far. The folder joins the section above once
# every page in it has been rewritten.
[docs/reference/{agent-configuration,api-versions,configuration,errors,operator-scripts,permissions,rest-api,sql-sessions-api,sql-support}.md]
DuckHaven.Changelog = error
DuckHaven.FuturePromises = error
DuckHaven.Weasel = error
